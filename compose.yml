name: ${COMPOSE_PROJECT_NAME:-secure-web-starter}

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:12.3.2}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Run 'make init' first}
      MARIADB_USER: ${DB_USERNAME:?Run 'make init' first}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run 'make init' first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run 'make init' first}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --slow-query-log=ON
      - --log-output=TABLE
      - --long-query-time=${DB_SLOW_QUERY_SECONDS:-1}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.11-eclipse-temurin-21}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:21-jre-noble}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:?Run 'make init' first}
      DB_USERNAME: ${DB_USERNAME:?Run 'make init' first}
      DB_PASSWORD: ${DB_PASSWORD:?Run 'make init' first}
      SESSION_COOKIE_SECURE: "false"
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-true}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost.invalid}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:?Run 'make init' first}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-false}
      APP_SESSION_METADATA_MAX_ENTRIES: ${APP_SESSION_METADATA_MAX_ENTRIES:-10000}
      APP_FRAME_OPTIONS: ${APP_FRAME_OPTIONS:-SAMEORIGIN}
      APP_I18N_DEFAULT_LOCALE: ${APP_I18N_DEFAULT_LOCALE:-en}
      APP_I18N_SUPPORTED_LOCALES: ${APP_I18N_SUPPORTED_LOCALES:-en,ko,zh,ja}
      APP_I18N_COOKIE_NAME: ${APP_I18N_COOKIE_NAME:-APP_LOCALE}
      APP_I18N_COOKIE_PATH: ${APP_I18N_COOKIE_PATH:-/}
      APP_I18N_COOKIE_MAX_AGE: ${APP_I18N_COOKIE_MAX_AGE:-365d}
      APP_I18N_COOKIE_SAME_SITE: ${APP_I18N_COOKIE_SAME_SITE:-Lax}
      APP_I18N_COOKIE_SECURE: ${APP_I18N_COOKIE_SECURE:-false}
      APP_I18N_RESPECT_ACCEPT_LANGUAGE: ${APP_I18N_RESPECT_ACCEPT_LANGUAGE:-true}
      APP_I18N_CACHE_MAX_ENTRIES: ${APP_I18N_CACHE_MAX_ENTRIES:-50000}
      APP_I18N_CACHE_TTL: ${APP_I18N_CACHE_TTL:-5m}
      APP_WORKSPACE_MAX_TABS: ${APP_WORKSPACE_MAX_TABS:-12}
      APP_WORKSPACE_DEFAULT_MENU_KEY: ${APP_WORKSPACE_DEFAULT_MENU_KEY:-dashboard}
      APP_WORKSPACE_STORAGE_KEY: ${APP_WORKSPACE_STORAGE_KEY:-secure-mvc-workspace}
      APP_WORKSPACE_RESERVED_PATHS: ${APP_WORKSPACE_RESERVED_PATHS:-/workspace,/login,/logout,/register,/locale,/error,/assets,/internal}
      APP_SQL_LOG_LEVEL: ${APP_SQL_LOG_LEVEL:-DEBUG}
      APP_SQL_BIND_LOG_LEVEL: ${APP_SQL_BIND_LOG_LEVEL:-OFF}
      APP_DB_DRIVER_LOG_LEVEL: ${APP_DB_DRIVER_LOG_LEVEL:-OFF}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - app-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/internal/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  mariadb-data:
  app-logs:
